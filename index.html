<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח התוכן של לנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap">
<style>
  :root{
    --gold:#E8C020;
    --gold-ink:#5C3D0A;
    --coral:#D0575C;
    --coral-ink:#FFF7F3;
    --plum:#8C3B54;
    --plum-ink:#FFF3F5;
    --clay:#D8A55C;
    --clay-ink:#3B2609;
    --cream:#FBF7EE;
    --cream-2:#F3ECDC;
    --ink:#2E2A24;
    --ink-soft:#7A7266;
    --line:#EAE1CB;
    --shadow: 0 4px 14px rgba(140,59,84,0.08);
    --shadow-card: 0 3px 8px rgba(46,42,36,0.14);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Heebo','Rubik',sans-serif;
    direction:rtl;
    min-height:100vh;
  }

  .page{
    max-width:1400px;
    margin:0 auto;
    padding:28px 32px 60px;
  }

  /* ---------- header / hero ---------- */
  .hero{
    position:relative;
    width:100%;
    height:340px;
    border-radius:24px;
    overflow:hidden;
    margin-bottom:30px;
    box-shadow:var(--shadow);
  }
  .hero-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 15%;
  }
  .hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,
      rgba(140,59,84,0) 28%,
      rgba(104,40,62,0.45) 62%,
      rgba(74,26,45,0.8) 100%);
  }
  .hero-text{
    position:absolute;
    right:0;
    left:0;
    bottom:0;
    padding:28px 34px 30px;
  }
  .hero-text h1{
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:clamp(28px,4vw,44px);
    margin:0 0 8px;
    color:#fff;
    letter-spacing:0.2px;
    text-shadow:0 2px 12px rgba(30,10,18,0.35);
  }
  .hero-text p{
    margin:0;
    color:#FCEFE6;
    font-size:16.5px;
    font-weight:500;
    text-shadow:0 1px 8px rgba(30,10,18,0.35);
  }

  /* ---------- layout ---------- */
  .board{
    display:flex;
  }
  .calendar-col{
    flex:1 1 auto;
    min-width:0;
    width:100%;
  }

  /* ---------- calendar nav ---------- */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:16px;
  }
  .cal-nav .month-label{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--ink);
    min-width:180px;
    text-align:center;
  }
  .nav-btn{
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:#fff;
    color:var(--plum);
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    box-shadow:var(--shadow-card);
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, background .15s ease;
  }
  .nav-btn:hover{ background:var(--gold); color:#fff; transform:translateY(-1px); }
  .today-btn{
    border:none;
    background:var(--coral);
    color:var(--coral-ink);
    font-family:'Heebo',sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:var(--shadow-card);
    transition:filter .15s ease;
  }
  .today-btn:hover{ filter:brightness(1.06); }

  .stale-notice{
    width:fit-content;
    max-width:100%;
    margin:0 auto 14px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    background:var(--cream-2);
    border-radius:999px;
    padding:6px 16px;
  }
  .stale-notice[hidden]{ display:none; }

  .promo-box{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    background:#fff;
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:12px 18px;
    margin-bottom:16px;
  }
  .promo-box[hidden]{ display:none; }
  .promo-label{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:14.5px;
    color:var(--plum);
    flex:none;
  }
  .promo-tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .promo-tag{
    background:var(--cream-2);
    color:var(--plum);
    font-weight:600;
    font-size:13.5px;
    padding:6px 14px;
    border-radius:999px;
  }

  /* ---------- calendar grid ---------- */
  .cal-card{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
  }
  .cal-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,minmax(80px,1fr));
    gap:8px;
    margin-bottom:8px;
  }
  .weekdays span{
    text-align:center;
    font-weight:700;
    font-size:14px;
    color:var(--plum);
    padding:4px 0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(80px,1fr));
    gap:8px;
  }
  .day{
    background:var(--cream);
    border-radius:14px;
    padding:8px;
    min-height:118px;
    display:flex;
    flex-direction:column;
    gap:6px;
    border:2px solid transparent;
    transition:background .12s ease, border-color .12s ease;
  }
  .day.outside{
    background:transparent;
    visibility:hidden;
  }
  .day.today{
    border-color:var(--gold);
    background:#FFFBEF;
  }
  .day.drag-over{
    border-color:var(--coral);
    background:#FDEDEC;
  }
  .day-num{
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:20px;
    color:var(--ink);
    padding:0 2px;
  }
  .day.today .day-num{ color:var(--coral); }

  .card{
    border-radius:12px;
    padding:7px 9px;
    cursor:grab;
    box-shadow:var(--shadow-card);
    line-height:1.25;
    user-select:none;
  }
  .card:active{ cursor:grabbing; }
  .card .tag{
    display:block;
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:0.6px;
    opacity:0.9;
    margin-bottom:2px;
  }
  .card .name{
    display:block;
    font-weight:600;
    font-size:13.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .card.dragging{ opacity:0.4; }

  .type-reel{ background:var(--coral); color:var(--coral-ink); }
  .type-story{ background:var(--gold); color:var(--gold-ink); }
  .type-reelstory{ background:var(--plum); color:var(--plum-ink); }
  .type-other{ background:var(--clay); color:var(--clay-ink); }

  footer.hint{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    margin-top:28px;
  }

  /* ---------- content modal ---------- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(46,42,36,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-backdrop[hidden]{ display:none; }
  .modal{
    position:relative;
    background:#fff;
    border-radius:20px;
    box-shadow:0 16px 40px rgba(46,42,36,0.28);
    width:100%;
    max-width:440px;
    max-height:min(600px,86vh);
    overflow-y:auto;
    padding:26px 26px 24px;
  }
  .modal-close{
    position:absolute;
    top:14px;
    left:14px;
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:var(--cream-2);
    color:var(--ink);
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .12s ease, color .12s ease;
  }
  .modal-close:hover{ background:var(--coral); color:var(--coral-ink); }
  .modal-tag{
    display:inline-block;
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:11px;
    letter-spacing:0.6px;
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .modal-tag.today-badge{ background:var(--gold); color:var(--gold-ink); }

  .today-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:15px;
    padding:22px 8px 6px;
    margin:0;
  }
  .today-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:6px;
  }
  .today-item{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    border:none;
    border-radius:14px;
    padding:13px 15px;
    cursor:pointer;
    text-align:right;
    font-family:'Heebo',sans-serif;
    box-shadow:var(--shadow-card);
    transition:filter .12s ease, transform .12s ease;
  }
  .today-item:hover{ filter:brightness(1.05); transform:translateY(-1px); }
  .today-item .tag{
    flex:none;
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:0.6px;
    opacity:0.9;
    background:rgba(255,255,255,0.35);
    padding:4px 9px;
    border-radius:999px;
  }
  .today-item .name{
    flex:1;
    font-weight:600;
    font-size:15.5px;
  }
  .modal-title{
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:22px;
    color:var(--ink);
    margin:0 0 16px;
    padding-left:34px;
    line-height:1.35;
  }
  .modal-section{ margin-bottom:18px; }
  .modal-section:last-of-type{ margin-bottom:0; }
  .modal-section h4{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--plum);
    margin:0 0 6px;
  }
  .modal-section p{
    margin:0;
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink);
    white-space:pre-wrap;
  }
  .copy-text-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--plum);
    font-family:'Heebo',sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:9px 15px;
    border-radius:999px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .copy-text-btn:hover{ background:var(--cream-2); }
  .copy-confirm{
    display:inline-block;
    margin-inline-start:10px;
    font-size:13px;
    font-weight:700;
    color:#3F7A4E;
    opacity:0;
    transition:opacity .25s ease;
  }
  .copy-confirm.show{ opacity:1; }
  .modal-drive-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    margin-top:20px;
    border:none;
    border-radius:14px;
    background:var(--coral);
    color:var(--coral-ink);
    font-family:'Heebo',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:14px 16px;
    cursor:pointer;
    text-decoration:none;
    box-shadow:var(--shadow-card);
    transition:filter .15s ease;
  }
  .modal-drive-btn:hover{ filter:brightness(1.06); }

  .modal-move{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  .modal-move h4{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--plum);
    margin:0 0 8px;
  }
  .modal-move-row{
    display:flex;
    gap:8px;
  }
  .modal-move-row input[type="date"]{
    flex:1;
    min-width:0;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    font-family:'Heebo',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--cream);
  }
  .modal-move-row button{
    flex:none;
    border:none;
    border-radius:12px;
    background:var(--gold);
    color:var(--gold-ink);
    font-family:'Heebo',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:0 18px;
    cursor:pointer;
    transition:filter .15s ease;
  }
  .modal-move-row button:hover{ filter:brightness(1.05); }

  @media (max-width:560px){
    .page{ padding:14px 12px 36px; }

    .promo-box{ flex-direction:column; align-items:flex-start; padding:12px 14px; }

    .hero{ height:180px; border-radius:16px; }
    .hero-text{ padding:14px 16px 16px; }
    .hero-text h1{ font-size:24px; margin:0 0 4px; }
    .hero-text p{ font-size:13.5px; }

    .cal-nav{ gap:10px; margin-bottom:12px; }
    .cal-nav .month-label{ font-size:19px; min-width:0; flex:1; }
    .nav-btn{ width:46px; height:46px; font-size:22px; }
    .today-btn{ padding:12px 18px; font-size:15px; }

    .cal-card{ padding:10px; }
    .day{ min-height:112px; padding:7px; }
    .card{ padding:9px 10px; }

    .modal{ padding:22px 18px 20px; }
    .modal-move-row{ flex-direction:column; }
    .modal-move-row button{ padding:12px 18px; width:100%; }

    .copy-text-btn{
      display:flex;
      width:100%;
      justify-content:center;
      padding:12px 16px;
      font-size:14.5px;
      margin-top:12px;
    }
    .copy-confirm{
      display:block;
      margin-inline-start:0;
      margin-top:8px;
      text-align:center;
    }
  }
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <img class="hero-img" src="assets/lena-header.png" alt="לנה ליילה">
    <div class="hero-overlay"></div>
    <div class="hero-text">
      <h1>לוח התוכן של לנה</h1>
      <p>מה מתפרסם ומתי</p>
    </div>
  </div>

  <div class="board">
    <div class="calendar-col">
      <div class="cal-nav">
        <button class="nav-btn" id="prevBtn" aria-label="חודש קודם">‹</button>
        <div class="month-label" id="monthLabel">ספטמבר 2026</div>
        <button class="nav-btn" id="nextBtn" aria-label="חודש הבא">›</button>
        <button class="today-btn" id="todayBtn">היום</button>
      </div>

      <div class="promo-box" id="promoBox" hidden>
        <span class="promo-label">החודש אנחנו מקדמות:</span>
        <div class="promo-tags" id="promoTags"></div>
      </div>

      <div class="stale-notice" id="staleNotice" hidden>⏱ המידע לא התעדכן כרגע — מוצגים הנתונים האחרונים שנשמרו</div>

      <div class="cal-card">
        <div class="cal-scroll">
          <div class="weekdays">
            <span>א׳</span><span>ב׳</span><span>ג׳</span><span>ד׳</span><span>ה׳</span><span>ו׳</span><span>ש׳</span>
          </div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="hint">גררו כרטיס בין ימים כדי לשנות תאריך פרסום, ולחצו על כרטיס כדי לראות פרטים</footer>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modalPanel" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="סגירה">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   נתוני תוכן — נקראים חיים מגיליון "כל הפרסומים" בגוגל שיטס,
   דרך Google Apps Script (Web App, קריאה בלבד).
   שלב עתידי: לחבר את updateContentDate לכתיבה חזרה לתאריך בגיליון
   (כרגע היא רק מעדכנת את המסך, ולא כותבת ל-Sheet).
   ========================================================= */
  const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbybMKduEV_HTYZxcH7yx2WDvHmmRposr1bzasVpXks2wOKh9uEAb8ukTPDX2EwWQptSCg/exec';

  let CONTENT = [];
  let MONTHLY_PLAN = [];

  function parseSheetDate(dateStr){
    if(!dateStr) return null;
    const parts = String(dateStr).trim().split('.');
    if(parts.length < 2) return null;
    let day = parseInt(parts[0], 10);
    let month = parseInt(parts[1], 10);
    if(isNaN(day) || isNaN(month)) return null;
    if(month > 12){
      month = parseInt(String(parts[1])[0], 10); // מתקן טעויות הקלדה כמו "29.90"
    }
    if(isNaN(month) || month < 1 || month > 12) return null;
    const year = today.getFullYear();
    return year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
  }

  function classifyType(task){
    task = task || '';
    const hasReel = task.includes('ריל') || task.includes('רייל');
    const hasStory = task.includes('סטור');
    if(hasReel && hasStory) return 'reelstory';
    if(hasReel) return 'reel';
    if(hasStory) return 'story';
    return 'other';
  }

  function rowToContentItem(row, idx){
    const reelName = (row.reelName || '').trim();
    const program = (row.program || '').trim();
    const title = (reelName && reelName.length <= 25) ? reelName : (program || reelName || 'ללא שם');
    return {
      id: idx + 1,
      date: parseSheetDate(row.date),
      type: classifyType(row.task),
      title: title,
      link: row.link ? row.link.trim() : null,
      text: row.text ? row.text.trim() : null,
      notes: row.notes ? row.notes.trim() : null
    };
  }

  const FETCH_TIMEOUT_MS = 12000; // אם הגיליון לא עונה תוך 12 שניות, נפסיק לחכות ונציג הודעה

  async function fetchSheetData(){
    const controller = new AbortController();
    const timer = setTimeout(()=> controller.abort(), FETCH_TIMEOUT_MS);
    let res;
    try{
      res = await fetch(SHEET_API_URL, { signal: controller.signal, cache: 'no-store' });
    }catch(err){
      if(err.name === 'AbortError'){
        throw new Error('תם הזמן להמתנה לתשובה מהגיליון (מעל ' + (FETCH_TIMEOUT_MS/1000) + ' שניות)');
      }
      throw err;
    }finally{
      clearTimeout(timer);
    }
    if(!res.ok) throw new Error('שגיאת רשת: ' + res.status);
    let data;
    try{
      data = await res.json();
    }catch(err){
      throw new Error('התקבלה תשובה לא תקינה מהגיליון');
    }
    return { rows: data.rows || [], monthlyPlan: data.monthlyPlan || [] };
  }

  function mapRowsToContent(rows){
    return rows.map(rowToContentItem);
  }

  function mapMonthlyPlanRows(rows){
    return rows.map(r=>({
      program: (r.program || '').trim(),
      monthIndex: MONTH_INDEX[(r.month || '').trim()],
      year: parseInt(r.year, 10)
    })).filter(p => p.program && p.monthIndex !== undefined && !isNaN(p.year));
  }

  /* ---------- מטמון מקומי (localStorage) ----------
     שומר את הנתונים הגולמיים שהתקבלו בפעם האחרונה מהגיליון (כל הפרסומים +
     תכנון חודשי), כדי שבפתיחה הבאה של הדשבורד יהיה מיד מה להציג, גם לפני
     שהתשובה החיה מגיעה. */
  const CACHE_KEY = 'lenaDashboardCache_v1';

  function loadCachedData(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.rows)) return null;
      return { rows: parsed.rows, monthlyPlan: parsed.monthlyPlan || [] };
    }catch(err){
      return null;
    }
  }

  function saveCachedData(rows, monthlyPlan){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({ rows: rows, monthlyPlan: monthlyPlan, savedAt: Date.now() }));
    }catch(err){
      // localStorage לא זמין (מצב פרטי / מלא) — לא קריטי, פשוט נמשיך בלי מטמון
    }
  }

  function setStaleNoticeVisible(visible){
    document.getElementById('staleNotice').hidden = !visible;
  }

  const TYPE_META = {
    reel:      { label:'REEL',        cls:'type-reel' },
    story:     { label:'STORY',       cls:'type-story' },
    reelstory: { label:'REEL + STORY',cls:'type-reelstory' },
    other:     { label:'תוכן',        cls:'type-other' }
  };

  const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  const MONTH_INDEX = {};
  MONTHS_HE.forEach((m,i)=>{ MONTH_INDEX[m] = i; });

  const today = new Date();
  const todayStr = ymd(today);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-indexed

  function ymd(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function updateContentDate(id, newDate){
    const item = CONTENT.find(c => c.id === id);
    if(!item) return;
    item.date = newDate; // newDate === null => "מחכים לשיבוץ"
    // TODO (שלב הבא): לקרוא כאן לפונקציית כתיבה ל-Google Sheets
    // שתעדכן את עמודת "תאריך" עבור השורה המתאימה בגיליון "כל הפרסומים".
    renderAll();
  }

  function buildCardEl(item){
    const el = document.createElement('div');
    el.className = 'card ' + TYPE_META[item.type].cls;
    el.draggable = true;
    el.dataset.id = item.id;
    el.innerHTML = '<span class="tag">'+TYPE_META[item.type].label+'</span><span class="name">'+item.title+'</span>';
    el.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', String(item.id));
      el.classList.add('dragging');
      el._wasDragged = true;
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('dragging');
      setTimeout(()=>{ el._wasDragged = false; }, 0);
    });
    el.addEventListener('click', ()=>{
      if(el._wasDragged) return;
      openModal(item);
    });
    return el;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function openModal(item){
    const meta = TYPE_META[item.type];
    let html = '<span class="modal-tag ' + meta.cls + '">' + meta.label + '</span>';
    html += '<h3 class="modal-title">' + escapeHtml(item.title) + '</h3>';

    if(item.text){
      html += '<div class="modal-section"><h4>תוכן כתוב</h4><p>' + escapeHtml(item.text) + '</p>' +
        '<button type="button" class="copy-text-btn" id="copyTextBtn">📋 העתקת המלל</button>' +
        '<span class="copy-confirm" id="copyConfirm">✓ המלל הועתק</span>' +
      '</div>';
    }
    if(item.notes){
      html += '<div class="modal-section"><h4>הערות</h4><p>' + escapeHtml(item.notes) + '</p></div>';
    }
    if(item.link){
      html += '<a class="modal-drive-btn" href="' + item.link + '" target="_blank" rel="noopener">🔗 פתיחת החומר ב-Drive</a>';
    }

    html += '<div class="modal-move">' +
      '<h4>העברה לתאריך אחר</h4>' +
      '<div class="modal-move-row">' +
        '<input type="date" id="moveDateInput" value="' + (item.date || '') + '">' +
        '<button type="button" id="moveDateBtn">העברה</button>' +
      '</div>' +
    '</div>';

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalBackdrop').hidden = false;

    const copyBtn = document.getElementById('copyTextBtn');
    if(copyBtn){
      copyBtn.addEventListener('click', async ()=>{
        try{
          await navigator.clipboard.writeText(item.text);
        }catch(err){
          const ta = document.createElement('textarea');
          ta.value = item.text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        const confirmEl = document.getElementById('copyConfirm');
        confirmEl.classList.add('show');
        clearTimeout(copyBtn._hideTimer);
        copyBtn._hideTimer = setTimeout(()=> confirmEl.classList.remove('show'), 1800);
      });
    }

    document.getElementById('moveDateBtn').addEventListener('click', ()=>{
      const val = document.getElementById('moveDateInput').value;
      if(!val) return;
      const parts = val.split('-').map(Number);
      viewYear = parts[0];
      viewMonth = parts[1] - 1;
      updateContentDate(item.id, val); // מעדכן רק את התצוגה; לא כותב ל-Google Sheets
      closeModal();
    });
  }

  function closeModal(){
    document.getElementById('modalBackdrop').hidden = true;
  }

  function formatHebrewDate(d){
    return d.getDate() + ' ב' + MONTHS_HE[d.getMonth()] + ' ' + d.getFullYear();
  }

  function openTodayModal(){
    const items = CONTENT.filter(c => c.date === todayStr);

    let html = '<span class="modal-tag today-badge">היום</span>';
    html += '<h3 class="modal-title">' + escapeHtml(formatHebrewDate(today)) + '</h3>';

    if(items.length === 0){
      html += '<p class="today-empty">אין תוכן מתוכנן להיום</p>';
    } else {
      html += '<div class="today-list">';
      items.forEach(item=>{
        const meta = TYPE_META[item.type];
        html += '<button type="button" class="today-item ' + meta.cls + '" data-id="' + item.id + '">' +
                  '<span class="tag">' + meta.label + '</span>' +
                  '<span class="name">' + escapeHtml(item.title) + '</span>' +
                '</button>';
      });
      html += '</div>';
    }

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalBackdrop').hidden = false;

    document.querySelectorAll('.today-item').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const item = CONTENT.find(c => c.id === Number(btn.dataset.id));
        if(item) openModal(item); // אותו חלון פרטים שכבר קיים - מלל, הערות וקישור ל-Drive
      });
    });
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', e=>{
    if(e.target.id === 'modalBackdrop') closeModal();
  });
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape') closeModal();
  });

  function renderCalendar(){
    document.getElementById('monthLabel').textContent = MONTHS_HE[viewMonth] + ' ' + viewYear;
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    const firstWeekday = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sunday
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;

    for(let i=0; i<totalCells; i++){
      const dayNum = i - firstWeekday + 1;
      const cell = document.createElement('div');

      if(dayNum < 1 || dayNum > daysInMonth){
        cell.className = 'day outside';
        grid.appendChild(cell);
        continue;
      }

      const dateStr = viewYear+'-'+String(viewMonth+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0');
      cell.className = 'day' + (dateStr === todayStr ? ' today' : '');
      cell.dataset.date = dateStr;

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = dayNum;
      cell.appendChild(num);

      CONTENT.filter(c => c.date === dateStr).forEach(item=>{
        cell.appendChild(buildCardEl(item));
      });

      cell.addEventListener('dragover', e=>{ e.preventDefault(); cell.classList.add('drag-over'); });
      cell.addEventListener('dragleave', ()=> cell.classList.remove('drag-over'));
      cell.addEventListener('drop', e=>{
        e.preventDefault();
        cell.classList.remove('drag-over');
        const id = Number(e.dataTransfer.getData('text/plain'));
        updateContentDate(id, dateStr);
      });

      grid.appendChild(cell);
    }
  }

  function renderMonthlyPromo(){
    const box = document.getElementById('promoBox');
    const tagsEl = document.getElementById('promoTags');
    const matches = MONTHLY_PLAN.filter(p => p.monthIndex === viewMonth && p.year === viewYear);

    if(matches.length === 0){
      box.hidden = true;
      tagsEl.innerHTML = '';
      return;
    }

    tagsEl.innerHTML = matches.map(p => '<span class="promo-tag">' + escapeHtml(p.program) + '</span>').join('');
    box.hidden = false;
  }

  function renderAll(){
    renderCalendar();
    renderMonthlyPromo();
  }

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderAll();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderAll();
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    renderAll();
    openTodayModal();
  });

  async function init(){
    const grid = document.getElementById('grid');
    setStaleNoticeVisible(false);

    const cached = loadCachedData();
    const hasCache = !!(cached && cached.rows.length);

    if(hasCache){
      CONTENT = mapRowsToContent(cached.rows);
      MONTHLY_PLAN = mapMonthlyPlanRows(cached.monthlyPlan);
      renderAll();
    } else {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:40px 0;">טוענת נתונים מהגיליון…</p>';
    }

    try{
      const fresh = await fetchSheetData();
      CONTENT = mapRowsToContent(fresh.rows);
      MONTHLY_PLAN = mapMonthlyPlanRows(fresh.monthlyPlan);
      saveCachedData(fresh.rows, fresh.monthlyPlan);
      renderAll();
      setStaleNoticeVisible(false);
    }catch(err){
      console.error(err);
      if(hasCache){
        // יש כבר מה להציג על המסך — משאירים אותו, רק מודיעים בעדינות שהוא לא עודכן.
        setStaleNoticeVisible(true);
      } else {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:40px 0;">לא הצלחנו לטעון כרגע נתונים מהגיליון. רעננו את הדף ונסו שוב.</p>';
      }
    }
  }

  init();
</script>
</body>
</html>
