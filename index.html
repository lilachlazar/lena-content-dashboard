<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>לוח התוכן של לנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap">
<style>
  :root{
    --gold:#E8C020;
    --gold-ink:#5C3D0A;
    --coral:#D0575C;
    --coral-ink:#FFF7F3;
    --plum:#8C3B54;
    --plum-ink:#FFF3F5;
    --clay:#D8A55C;
    --clay-ink:#3B2609;
    --cream:#FBF7EE;
    --cream-2:#F3ECDC;
    --ink:#2E2A24;
    --ink-soft:#7A7266;
    --line:#EAE1CB;
    --shadow: 0 4px 14px rgba(140,59,84,0.08);
    --shadow-card: 0 3px 8px rgba(46,42,36,0.14);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Heebo','Rubik',sans-serif;
    direction:rtl;
    min-height:100vh;
  }

  .page{
    max-width:1400px;
    margin:0 auto;
    padding:28px 32px 60px;
  }

  /* ---------- header / hero ---------- */
  .hero{
    position:relative;
    width:100%;
    height:340px;
    border-radius:24px;
    overflow:hidden;
    margin-bottom:30px;
    box-shadow:var(--shadow);
  }
  .hero-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 15%;
  }
  .hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,
      rgba(140,59,84,0) 28%,
      rgba(104,40,62,0.45) 62%,
      rgba(74,26,45,0.8) 100%);
  }
  .hero-text{
    position:absolute;
    right:0;
    left:0;
    bottom:0;
    padding:28px 34px 30px;
  }
  .hero-text h1{
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:clamp(28px,4vw,44px);
    margin:0 0 8px;
    color:#fff;
    letter-spacing:0.2px;
    text-shadow:0 2px 12px rgba(30,10,18,0.35);
  }
  .hero-text p{
    margin:0;
    color:#FCEFE6;
    font-size:16.5px;
    font-weight:500;
    text-shadow:0 1px 8px rgba(30,10,18,0.35);
  }

  /* ---------- layout ---------- */
  .board{
    display:flex;
  }
  .calendar-col{
    flex:1 1 auto;
    min-width:0;
    width:100%;
  }

  /* ---------- calendar nav ---------- */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:16px;
  }
  .cal-nav .month-label{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--ink);
    min-width:180px;
    text-align:center;
  }
  .nav-btn{
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:#fff;
    color:var(--plum);
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    box-shadow:var(--shadow-card);
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, background .15s ease;
  }
  .nav-btn:hover{ background:var(--gold); color:#fff; transform:translateY(-1px); }
  .today-btn{
    border:none;
    background:var(--coral);
    color:var(--coral-ink);
    font-family:'Heebo',sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:var(--shadow-card);
    transition:filter .15s ease;
  }
  .today-btn:hover{ filter:brightness(1.06); }

  .stale-notice{
    width:fit-content;
    max-width:100%;
    margin:0 auto 10px;
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.8;
    background:transparent;
    border-radius:999px;
    padding:2px 10px;
  }
  .stale-notice[hidden]{ display:none; }

  .promo-box{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    background:#fff;
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:12px 18px;
    margin-bottom:16px;
  }
  .promo-box[hidden]{ display:none; }
  .promo-label{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:14.5px;
    color:var(--plum);
    flex:none;
  }
  .promo-tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .promo-tag{
    font-weight:600;
    font-size:13.5px;
    padding:6px 14px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    font-family:'Heebo',sans-serif;
    transition:filter .12s ease, transform .12s ease;
  }
  .promo-tag:hover{ filter:brightness(1.05); transform:translateY(-1px); }

  /* ---------- calendar grid ---------- */
  .cal-card{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
  }
  .cal-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,minmax(80px,1fr));
    gap:8px;
    margin-bottom:8px;
  }
  .weekdays span{
    text-align:center;
    font-weight:700;
    font-size:14px;
    color:var(--plum);
    padding:4px 0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(80px,1fr));
    gap:8px;
  }
  .day{
    background:var(--cream);
    border-radius:14px;
    padding:8px;
    min-height:118px;
    display:flex;
    flex-direction:column;
    gap:6px;
    border:2px solid transparent;
    transition:background .12s ease, border-color .12s ease;
  }
  .day.outside{
    background:transparent;
    visibility:hidden;
  }
  .day.today{
    border-color:var(--gold);
    background:#FFFBEF;
  }
  .day.drag-over{
    border-color:var(--coral);
    background:#FDEDEC;
  }
  .day-num{
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:20px;
    color:var(--ink);
    padding:0 2px;
  }
  .day.today .day-num{ color:var(--coral); }

  .day-holiday{
    font-size:10px;
    font-weight:600;
    color:var(--ink-soft);
    line-height:1.25;
    margin-top:-3px;
    padding:0 2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .card{
    border-radius:12px;
    padding:7px 9px;
    cursor:grab;
    box-shadow:var(--shadow-card);
    line-height:1.25;
    user-select:none;
  }
  .card:active{ cursor:grabbing; }
  .card .tag{
    display:block;
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:0.6px;
    opacity:0.9;
    margin-bottom:2px;
  }
  .card .name{
    display:block;
    font-weight:600;
    font-size:13.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .card .content-type{
    display:block;
    font-size:10.5px;
    font-weight:500;
    opacity:0.85;
    margin-top:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card.dragging{ opacity:0.4; }

  .notes-box{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 22px;
    margin-top:22px;
  }
  .notes-box[hidden]{ display:none; }
  .notes-title{
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:19px;
    color:var(--plum);
    margin:0 0 14px;
  }
  .notes-section{ margin-bottom:16px; }
  .notes-section:last-child{ margin-bottom:0; }
  .notes-section[hidden]{ display:none; }
  .notes-section h3{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    margin:0 0 8px;
  }
  .notes-section ul{
    margin:0;
    padding-inline-start:0;
    padding-inline-end:20px;
    list-style:disc;
  }
  .notes-section li{
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink);
    margin-bottom:4px;
  }
  .notes-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0;
    padding:6px 0;
  }
  .notes-empty[hidden]{ display:none; }

  /* ---------- content modal ---------- */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(46,42,36,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-backdrop[hidden]{ display:none; }
  .modal{
    position:relative;
    background:#fff;
    border-radius:20px;
    box-shadow:0 16px 40px rgba(46,42,36,0.28);
    width:100%;
    max-width:440px;
    max-height:min(600px,86vh);
    overflow-y:auto;
    padding:26px 26px 24px;
  }
  .modal-close{
    position:absolute;
    top:14px;
    left:14px;
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:var(--cream-2);
    color:var(--ink);
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .12s ease, color .12s ease;
  }
  .modal-close:hover{ background:var(--coral); color:var(--coral-ink); }
  .modal-tag{
    display:inline-block;
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:11px;
    letter-spacing:0.6px;
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .modal-tag.today-badge{ background:var(--gold); color:var(--gold-ink); }

  .today-empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:15px;
    padding:22px 8px 6px;
    margin:0;
  }
  .category-count{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:-8px 0 14px;
  }
  .content-type-line{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:-8px 0 16px;
  }
  .today-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:6px;
  }
  .today-item{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    border:none;
    border-radius:14px;
    padding:13px 15px;
    cursor:pointer;
    text-align:right;
    font-family:'Heebo',sans-serif;
    box-shadow:var(--shadow-card);
    transition:filter .12s ease, transform .12s ease;
  }
  .today-item:hover{ filter:brightness(1.05); transform:translateY(-1px); }
  .today-item .tag{
    flex:none;
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:0.6px;
    opacity:0.9;
    background:rgba(255,255,255,0.35);
    padding:4px 9px;
    border-radius:999px;
  }
  .today-item .name{
    flex:1;
    font-weight:600;
    font-size:15.5px;
  }
  .today-item .item-sub{
    display:block;
    font-size:12px;
    font-weight:500;
    opacity:0.85;
    margin-top:2px;
  }
  .modal-title{
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:22px;
    color:var(--ink);
    margin:0 0 16px;
    padding-left:34px;
    line-height:1.35;
  }
  .modal-section{ margin-bottom:18px; }
  .modal-section:last-of-type{ margin-bottom:0; }
  .modal-section h4{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--plum);
    margin:0 0 6px;
  }
  .modal-section p{
    margin:0;
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink);
    white-space:pre-wrap;
  }
  .copy-text-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--plum);
    font-family:'Heebo',sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:9px 15px;
    border-radius:999px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .copy-text-btn:hover{ background:var(--cream-2); }
  .copy-confirm{
    display:inline-block;
    margin-inline-start:10px;
    font-size:13px;
    font-weight:700;
    color:#3F7A4E;
    opacity:0;
    transition:opacity .25s ease;
  }
  .copy-confirm.show{ opacity:1; }
  .modal-drive-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    margin-top:20px;
    border:none;
    border-radius:14px;
    background:var(--coral);
    color:var(--coral-ink);
    font-family:'Heebo',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:14px 16px;
    cursor:pointer;
    text-decoration:none;
    box-shadow:var(--shadow-card);
    transition:filter .15s ease;
  }
  .modal-drive-btn:hover{ filter:brightness(1.06); }

  .modal-move{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  .modal-move h4{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--plum);
    margin:0 0 8px;
  }
  .modal-move-row{
    display:flex;
    gap:8px;
  }
  .modal-move-row input[type="date"]{
    flex:1;
    min-width:0;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    font-family:'Heebo',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--cream);
  }
  .modal-move-row button{
    flex:none;
    border:none;
    border-radius:12px;
    background:var(--gold);
    color:var(--gold-ink);
    font-family:'Heebo',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:0 18px;
    cursor:pointer;
    transition:filter .15s ease;
  }
  .modal-move-row button:hover{ filter:brightness(1.05); }

  @media (max-width:560px){
    .page{ padding:14px 12px 36px; }

    .promo-box{ flex-direction:column; align-items:flex-start; padding:12px 14px; }
    .notes-box{ padding:16px 16px; margin-top:16px; }
    .day-holiday{ font-size:8.5px; }

    .hero{ height:180px; border-radius:16px; }
    .hero-text{ padding:14px 16px 16px; }
    .hero-text h1{ font-size:24px; margin:0 0 4px; }
    .hero-text p{ font-size:13.5px; }

    .cal-nav{ gap:10px; margin-bottom:12px; }
    .cal-nav .month-label{ font-size:19px; min-width:0; flex:1; }
    .nav-btn{ width:46px; height:46px; font-size:22px; }
    .today-btn{ padding:12px 18px; font-size:15px; }

    .cal-card{ padding:10px; }
    .day{ min-height:112px; padding:7px; }
    .card{ padding:9px 10px; }

    .modal{ padding:22px 18px 20px; }
    .modal-move-row{ flex-direction:column; }
    .modal-move-row button{ padding:12px 18px; width:100%; }

    .copy-text-btn{
      display:flex;
      width:100%;
      justify-content:center;
      padding:12px 16px;
      font-size:14.5px;
      margin-top:12px;
    }
    .copy-confirm{
      display:block;
      margin-inline-start:0;
      margin-top:8px;
      text-align:center;
    }
  }
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <img class="hero-img" src="assets/lena-header.png" alt="לנה ליילה">
    <div class="hero-overlay"></div>
    <div class="hero-text">
      <h1>לוח התוכן של לנה</h1>
      <p>מה מתפרסם ומתי</p>
    </div>
  </div>

  <div class="board">
    <div class="calendar-col">
      <div class="cal-nav">
        <button class="nav-btn" id="prevBtn" aria-label="חודש קודם">‹</button>
        <div class="month-label" id="monthLabel">ספטמבר 2026</div>
        <button class="nav-btn" id="nextBtn" aria-label="חודש הבא">›</button>
        <button class="today-btn" id="todayBtn">היום</button>
      </div>

      <div class="promo-box" id="promoBox" hidden>
        <span class="promo-label">החודש אנחנו מקדמות:</span>
        <div class="promo-tags" id="promoTags"></div>
      </div>

      <div class="stale-notice" id="staleNotice" hidden>⏱ המידע לא התעדכן כרגע — מוצגים הנתונים האחרונים שנשמרו</div>

      <div class="cal-card">
        <div class="cal-scroll">
          <div class="weekdays">
            <span>א׳</span><span>ב׳</span><span>ג׳</span><span>ד׳</span><span>ה׳</span><span>ו׳</span><span>ש׳</span>
          </div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="notes-box" id="notesBox" hidden>
    <h2 class="notes-title">הערות ללנה</h2>
    <div class="notes-section" id="notesReelSection" hidden>
      <h3>🎬 הכנת ריל</h3>
      <ul id="notesReelList"></ul>
    </div>
    <div class="notes-section" id="notesStorySection" hidden>
      <h3>📱 הכנת סטורי</h3>
      <ul id="notesStoryList"></ul>
    </div>
    <p class="notes-empty" id="notesEmpty" hidden>אין כרגע דברים להכנה</p>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modalPanel" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="סגירה">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   נתוני תוכן — נקראים חיים מגיליון "כל הפרסומים" בגוגל שיטס,
   דרך Google Apps Script (Web App, קריאה בלבד).
   שלב עתידי: לחבר את updateContentDate לכתיבה חזרה לתאריך בגיליון
   (כרגע היא רק מעדכנת את המסך, ולא כותבת ל-Sheet).
   ========================================================= */
  const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbybMKduEV_HTYZxcH7yx2WDvHmmRposr1bzasVpXks2wOKh9uEAb8ukTPDX2EwWQptSCg/exec';

  let CONTENT = [];
  let MONTHLY_PLAN = [];
  let NOTES_FOR_LENA = [];

  function parseSheetDate(dateStr){
    if(!dateStr) return null;
    const parts = String(dateStr).trim().split('.');
    if(parts.length < 2) return null;
    let day = parseInt(parts[0], 10);
    let month = parseInt(parts[1], 10);
    if(isNaN(day) || isNaN(month)) return null;
    if(month > 12){
      month = parseInt(String(parts[1])[0], 10); // מתקן טעויות הקלדה כמו "29.90"
    }
    if(isNaN(month) || month < 1 || month > 12) return null;
    const year = today.getFullYear();
    return year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
  }

  function classifyType(task){
    task = task || '';
    const hasReel = task.includes('ריל') || task.includes('רייל');
    const hasStory = task.includes('סטור');
    if(hasReel && hasStory) return 'reelstory';
    if(hasReel) return 'reel';
    if(hasStory) return 'story';
    return 'other';
  }

  function rowToContentItem(row, idx){
    const reelName = (row.reelName || '').trim();
    const program = (row.program || '').trim();
    const title = (reelName && reelName.length <= 25) ? reelName : (program || reelName || 'ללא שם');
    return {
      id: idx + 1,
      date: parseSheetDate(row.date),
      type: classifyType(row.task),
      program: program,
      contentType: (row.task || '').trim(), // ערך גולמי מעמודת "סוג התוכן" בגיליון, לתצוגה בלבד
      title: title,
      link: row.link ? row.link.trim() : null,
      text: row.text ? row.text.trim() : null,
      notes: row.notes ? row.notes.trim() : null,
      manychat: row.manychat ? row.manychat.trim() : null,
      manychatLink: row.manychatLink ? row.manychatLink.trim() : null
    };
  }

  const FETCH_TIMEOUT_MS = 12000; // אם הגיליון לא עונה תוך 12 שניות, נפסיק לחכות ונציג הודעה

  async function fetchSheetData(){
    const controller = new AbortController();
    const timer = setTimeout(()=> controller.abort(), FETCH_TIMEOUT_MS);
    let res;
    try{
      res = await fetch(SHEET_API_URL, { signal: controller.signal, cache: 'no-store' });
    }catch(err){
      if(err.name === 'AbortError'){
        throw new Error('תם הזמן להמתנה לתשובה מהגיליון (מעל ' + (FETCH_TIMEOUT_MS/1000) + ' שניות)');
      }
      throw err;
    }finally{
      clearTimeout(timer);
    }
    if(!res.ok) throw new Error('שגיאת רשת: ' + res.status);
    let data;
    try{
      data = await res.json();
    }catch(err){
      throw new Error('התקבלה תשובה לא תקינה מהגיליון');
    }
    return {
      rows: data.rows || [],
      monthlyPlan: data.monthlyPlan || [],
      notesForLena: data.notesForLena || []
    };
  }

  function mapRowsToContent(rows){
    return rows.map(rowToContentItem);
  }

  function mapMonthlyPlanRows(rows){
    return rows.map(r=>({
      program: (r.program || '').trim(),
      monthIndex: MONTH_INDEX[(r.month || '').trim()],
      year: parseInt(r.year, 10)
    })).filter(p => p.program && p.monthIndex !== undefined && !isNaN(p.year));
  }

  function mapNotesForLenaRows(rows){
    return rows.map(r=>({
      type: (r.type || '').trim(),
      note: (r.note || '').trim()
    })).filter(n => n.type && n.note);
  }

  /* ---------- מטמון מקומי (localStorage) ----------
     שומר את הנתונים הגולמיים שהתקבלו בפעם האחרונה מהגיליון (כל הפרסומים,
     תכנון חודשי, הערות ללנה), כדי שבפתיחה הבאה של הדשבורד יהיה מיד מה
     להציג, גם לפני שהתשובה החיה מגיעה. */
  const CACHE_KEY = 'lenaDashboardCache_v1';

  function loadCachedData(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.rows)) return null;
      return {
        rows: parsed.rows,
        monthlyPlan: parsed.monthlyPlan || [],
        notesForLena: parsed.notesForLena || []
      };
    }catch(err){
      return null;
    }
  }

  function saveCachedData(rows, monthlyPlan, notesForLena){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        rows: rows,
        monthlyPlan: monthlyPlan,
        notesForLena: notesForLena,
        savedAt: Date.now()
      }));
    }catch(err){
      // localStorage לא זמין (מצב פרטי / מלא) — לא קריטי, פשוט נמשיך בלי מטמון
    }
  }

  function setStaleNoticeVisible(visible){
    document.getElementById('staleNotice').hidden = !visible;
  }

  const TYPE_META = {
    reel:      { label:'REEL' },
    story:     { label:'STORY' },
    reelstory: { label:'REEL + STORY' },
    other:     { label:'תוכן' }
  };

  /* ---------- צבע לפי תוכנית ----------
     הצבע הראשי של כרטיס נקבע לפי עמודת "שם התוכנית" בגיליון (program).
     סוג התוכן (REEL/STORY) קובע רק את עוצמת הגוון בתוך אותה משפחת צבע.
     תוכנית שלא מזוהה ברשימה מקבלת צבע ניטרלי — לא מנחשים שיוך. */
  const PROGRAM_COLORS = {
    'סדנת האגן האורגזמי':   { reel:{bg:'#8C3B54', ink:'#FFF3F5'}, story:{bg:'#F3DCE3', ink:'#5C2438'} },
    'קרמים':                { reel:{bg:'#D65C82', ink:'#FFF3F6'}, story:{bg:'#F8DCE6', ink:'#7A2E48'} },
    'השקת תוכנית אור־גזמית': { reel:{bg:'#D0575C', ink:'#FFF7F3'}, story:{bg:'#FAE0DE', ink:'#7A2E22'} },
    'צעצועי מין':           { reel:{bg:'#C1652E', ink:'#FFF6EE'}, story:{bg:'#F5E1CC', ink:'#6B3714'} },
    'מכשיר לרצפת אגן':      { reel:{bg:'#E8C020', ink:'#5C3D0A'}, story:{bg:'#FBEFC7', ink:'#6B4A0A'} },
    'אורגני':               { reel:{bg:'#708250', ink:'#FBF9EE'}, story:{bg:'#E3E8D6', ink:'#3E4A2A'} },
    'הכשרת מנחים LAVO':     { reel:{bg:'#3E7873', ink:'#FBF9EE'}, story:{bg:'#D9E6E3', ink:'#234943'} }
  };
  const NEUTRAL_COLOR = { bg:'#E4DCD0', ink:'#4A4038' };

  function getCardColor(item){
    const family = PROGRAM_COLORS[item.program];
    if(!family) return NEUTRAL_COLOR;
    return item.type === 'story' ? family.story : family.reel;
  }

  const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  const MONTH_INDEX = {};
  MONTHS_HE.forEach((m,i)=>{ MONTH_INDEX[m] = i; });

  const today = new Date();
  const todayStr = ymd(today);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-indexed

  function ymd(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function updateContentDate(id, newDate){
    const item = CONTENT.find(c => c.id === id);
    if(!item) return;
    item.date = newDate; // newDate === null => "מחכים לשיבוץ"
    // TODO (שלב הבא): לקרוא כאן לפונקציית כתיבה ל-Google Sheets
    // שתעדכן את עמודת "תאריך" עבור השורה המתאימה בגיליון "כל הפרסומים".
    renderAll();
  }

  function buildCardEl(item){
    const el = document.createElement('div');
    el.className = 'card';
    const color = getCardColor(item);
    el.style.background = color.bg;
    el.style.color = color.ink;
    el.draggable = true;
    el.dataset.id = item.id;
    el.innerHTML = '<span class="tag">'+TYPE_META[item.type].label+'</span><span class="name">'+item.title+'</span>' +
      (item.contentType ? '<span class="content-type">'+escapeHtml(item.contentType)+'</span>' : '');
    el.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', String(item.id));
      el.classList.add('dragging');
      el._wasDragged = true;
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('dragging');
      setTimeout(()=>{ el._wasDragged = false; }, 0);
    });
    el.addEventListener('click', ()=>{
      if(el._wasDragged) return;
      openModal(item);
    });
    return el;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function wireCopyButton(btnId, confirmId, text){
    const btn = document.getElementById(btnId);
    if(!btn || !text) return;
    btn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(text);
      }catch(err){
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const confirmEl = document.getElementById(confirmId);
      confirmEl.classList.add('show');
      clearTimeout(btn._hideTimer);
      btn._hideTimer = setTimeout(()=> confirmEl.classList.remove('show'), 1800);
    });
  }

  function openModal(item){
    const meta = TYPE_META[item.type];
    const color = getCardColor(item);
    let html = '<span class="modal-tag" style="background:' + color.bg + ';color:' + color.ink + '">' + meta.label + '</span>';
    html += '<h3 class="modal-title">' + escapeHtml(item.title) + '</h3>';

    if(item.contentType){
      html += '<p class="content-type-line">סוג תוכן: ' + escapeHtml(item.contentType) + '</p>';
    }

    if(item.text){
      html += '<div class="modal-section"><h4>תוכן כתוב</h4><p>' + escapeHtml(item.text) + '</p>' +
        '<button type="button" class="copy-text-btn" id="copyTextBtn">📋 העתקת המלל</button>' +
        '<span class="copy-confirm" id="copyConfirm">✓ המלל הועתק</span>' +
      '</div>';
    }
    if(item.manychat || item.manychatLink){
      html += '<div class="modal-section"><h4>💬 מלל ל-ManyChat</h4>';
      if(item.manychat){
        html += '<p>' + escapeHtml(item.manychat) + '</p>' +
          '<button type="button" class="copy-text-btn" id="copyManychatBtn">📋 העתקת מלל ל-ManyChat</button>' +
          '<span class="copy-confirm" id="copyManychatConfirm">✓ המלל ל-ManyChat הועתק</span>';
      }
      if(item.manychatLink){
        html += '<a class="copy-text-btn" href="' + escapeHtml(item.manychatLink) + '" target="_blank" rel="noopener" style="text-decoration:none;">💬 פתיחה ב-ManyChat</a>';
      }
      html += '</div>';
    }
    if(item.notes){
      html += '<div class="modal-section"><h4>הערות</h4><p>' + escapeHtml(item.notes) + '</p></div>';
    }
    if(item.link){
      html += '<a class="modal-drive-btn" href="' + item.link + '" target="_blank" rel="noopener">🔗 פתיחת החומר ב-Drive</a>';
    }

    html += '<div class="modal-move">' +
      '<h4>העברה לתאריך אחר</h4>' +
      '<div class="modal-move-row">' +
        '<input type="date" id="moveDateInput" value="' + (item.date || '') + '">' +
        '<button type="button" id="moveDateBtn">העברה</button>' +
      '</div>' +
    '</div>';

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalBackdrop').hidden = false;

    wireCopyButton('copyTextBtn', 'copyConfirm', item.text);
    wireCopyButton('copyManychatBtn', 'copyManychatConfirm', item.manychat);

    document.getElementById('moveDateBtn').addEventListener('click', ()=>{
      const val = document.getElementById('moveDateInput').value;
      if(!val) return;
      const parts = val.split('-').map(Number);
      viewYear = parts[0];
      viewMonth = parts[1] - 1;
      updateContentDate(item.id, val); // מעדכן רק את התצוגה; לא כותב ל-Google Sheets
      closeModal();
    });
  }

  function closeModal(){
    document.getElementById('modalBackdrop').hidden = true;
  }

  function formatHebrewDate(d){
    return d.getDate() + ' ב' + MONTHS_HE[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* ---------- חגים ומועדים ----------
     מבוסס על היכולת המובנית בדפדפן (Intl עם לוח שנה עברי) — בלי ספרייה
     חיצונית ובלי API — כך שהתאריכים מתעדכנים נכון אוטומטית בכל שנה,
     כולל שנים מעוברות (אדר א׳/אדר ב׳). רשימת חגים מרכזיים בלבד. */
  const HEBREW_CAL_FMT = new Intl.DateTimeFormat('en-US-u-ca-hebrew', { month:'numeric', day:'numeric' });

  const HOLIDAYS = [
    { month:'Tishri',   day:1,  emoji:'🍎', name:'ראש השנה' },
    { month:'Tishri',   day:10, emoji:'✡️', name:'יום כיפור' },
    { month:'Tishri',   day:15, emoji:'🌿', name:'סוכות' },
    { month:'Tishri',   day:22, emoji:'📜', name:'שמחת תורה' },
    { month:'Kislev',   day:25, emoji:'🕎', name:'חנוכה' },
    { month:'Shevat',   day:15, emoji:'🌳', name:'ט"ו בשבט' },
    { month:'Adar',     day:14, emoji:'🎭', name:'פורים' },
    { month:'Adar II',  day:14, emoji:'🎭', name:'פורים' },
    { month:'Nisan',    day:15, emoji:'🍷', name:'פסח' },
    { month:'Nisan',    day:27, emoji:'🕯️', name:'יום השואה' },
    { month:'Iyar',     day:4,  emoji:'🇮🇱', name:'יום הזיכרון' },
    { month:'Iyar',     day:5,  emoji:'🎉', name:'יום העצמאות' },
    { month:'Sivan',    day:6,  emoji:'🌾', name:'שבועות' },
    { month:'Av',       day:9,  emoji:'🕯️', name:'תשעה באב' }
  ];

  function getHolidayForDate(dateObj){
    let month, day;
    HEBREW_CAL_FMT.formatToParts(dateObj).forEach(p=>{
      if(p.type === 'month') month = p.value;
      if(p.type === 'day') day = parseInt(p.value, 10);
    });
    return HOLIDAYS.find(h => h.month === month && h.day === day) || null;
  }

  function openTodayModal(){
    const items = CONTENT.filter(c => c.date === todayStr);

    let html = '<span class="modal-tag today-badge">היום</span>';
    html += '<h3 class="modal-title">' + escapeHtml(formatHebrewDate(today)) + '</h3>';

    if(items.length === 0){
      html += '<p class="today-empty">אין תוכן מתוכנן להיום</p>';
    } else {
      html += '<div class="today-list">';
      items.forEach(item=>{
        const meta = TYPE_META[item.type];
        const color = getCardColor(item);
        html += '<button type="button" class="today-item" data-id="' + item.id + '" style="background:' + color.bg + ';color:' + color.ink + '">' +
                  '<span class="tag">' + meta.label + '</span>' +
                  '<span class="name">' + escapeHtml(item.title) + '</span>' +
                '</button>';
      });
      html += '</div>';
    }

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalBackdrop').hidden = false;

    document.querySelectorAll('.today-item').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const item = CONTENT.find(c => c.id === Number(btn.dataset.id));
        if(item) openModal(item); // אותו חלון פרטים שכבר קיים - מלל, הערות וקישור ל-Drive
      });
    });
  }

  function formatShortDate(iso){
    const parts = iso.split('-');
    return parseInt(parts[2],10) + '.' + parseInt(parts[1],10);
  }

  function openCategoryModal(program){
    const family = PROGRAM_COLORS[program];
    const color = family ? family.reel : NEUTRAL_COLOR;

    const items = CONTENT
      .filter(c => c.program === program && c.date)
      .filter(c=>{
        const parts = c.date.split('-');
        return parseInt(parts[0],10) === viewYear && (parseInt(parts[1],10) - 1) === viewMonth;
      })
      .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));

    let html = '<span class="modal-tag" style="background:' + color.bg + ';color:' + color.ink + '">' + escapeHtml(program) + '</span>';
    html += '<h3 class="modal-title">' + escapeHtml(program) + ' · ' + MONTHS_HE[viewMonth] + '</h3>';

    if(items.length === 0){
      html += '<p class="today-empty">אין תכנים בקטגוריה הזו בחודש הזה</p>';
    } else {
      html += '<p class="category-count">' + items.length + ' תכנים מתוכננים</p>';
      html += '<div class="today-list">';
      items.forEach(item=>{
        const meta = TYPE_META[item.type];
        const c = getCardColor(item);
        html += '<button type="button" class="today-item" data-id="' + item.id + '" style="background:' + c.bg + ';color:' + c.ink + '">' +
                  '<span class="tag">' + formatShortDate(item.date) + ' · ' + meta.label + '</span>' +
                  '<span class="name">' + escapeHtml(item.title) +
                    (item.contentType ? '<span class="item-sub">' + escapeHtml(item.contentType) + '</span>' : '') +
                  '</span>' +
                '</button>';
      });
      html += '</div>';
    }

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalBackdrop').hidden = false;

    document.querySelectorAll('.today-item').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const item = CONTENT.find(c => c.id === Number(btn.dataset.id));
        if(item) openModal(item);
      });
    });
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', e=>{
    if(e.target.id === 'modalBackdrop') closeModal();
  });
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape') closeModal();
  });

  function renderCalendar(){
    document.getElementById('monthLabel').textContent = MONTHS_HE[viewMonth] + ' ' + viewYear;
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    const firstWeekday = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sunday
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;

    for(let i=0; i<totalCells; i++){
      const dayNum = i - firstWeekday + 1;
      const cell = document.createElement('div');

      if(dayNum < 1 || dayNum > daysInMonth){
        cell.className = 'day outside';
        grid.appendChild(cell);
        continue;
      }

      const dateStr = viewYear+'-'+String(viewMonth+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0');
      cell.className = 'day' + (dateStr === todayStr ? ' today' : '');
      cell.dataset.date = dateStr;

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = dayNum;
      cell.appendChild(num);

      const holiday = getHolidayForDate(new Date(viewYear, viewMonth, dayNum));
      if(holiday){
        const hEl = document.createElement('div');
        hEl.className = 'day-holiday';
        hEl.textContent = holiday.emoji + ' ' + holiday.name;
        cell.appendChild(hEl);
      }

      CONTENT.filter(c => c.date === dateStr).forEach(item=>{
        cell.appendChild(buildCardEl(item));
      });

      cell.addEventListener('dragover', e=>{ e.preventDefault(); cell.classList.add('drag-over'); });
      cell.addEventListener('dragleave', ()=> cell.classList.remove('drag-over'));
      cell.addEventListener('drop', e=>{
        e.preventDefault();
        cell.classList.remove('drag-over');
        const id = Number(e.dataTransfer.getData('text/plain'));
        updateContentDate(id, dateStr);
      });

      grid.appendChild(cell);
    }
  }

  function renderMonthlyPromo(){
    const box = document.getElementById('promoBox');
    const tagsEl = document.getElementById('promoTags');
    const matches = MONTHLY_PLAN.filter(p => p.monthIndex === viewMonth && p.year === viewYear);

    if(matches.length === 0){
      box.hidden = true;
      tagsEl.innerHTML = '';
      return;
    }

    tagsEl.innerHTML = matches.map(p => {
      const family = PROGRAM_COLORS[p.program];
      const color = family ? family.reel : NEUTRAL_COLOR;
      return '<button type="button" class="promo-tag" data-program="' + escapeHtml(p.program) + '" style="background:' + color.bg + ';color:' + color.ink + '">' + escapeHtml(p.program) + '</button>';
    }).join('');
    box.hidden = false;

    tagsEl.querySelectorAll('.promo-tag').forEach(btn=>{
      btn.addEventListener('click', ()=> openCategoryModal(btn.dataset.program));
    });
  }

  function renderNotesForLena(){
    const box = document.getElementById('notesBox');
    const reelSection = document.getElementById('notesReelSection');
    const storySection = document.getElementById('notesStorySection');
    const reelList = document.getElementById('notesReelList');
    const storyList = document.getElementById('notesStoryList');
    const emptyMsg = document.getElementById('notesEmpty');

    // התאמה גמישה (לא רק "הכנת ריל"/"הכנת סטורי" מדויק) כדי לתפוס גם ניסוחים כמו "ריל" או "סטורי" בעמודת "סוג"
    const reelNotes = NOTES_FOR_LENA.filter(n => n.type.includes('ריל') || n.type.includes('רייל'));
    const storyNotes = NOTES_FOR_LENA.filter(n => n.type.includes('סטור'));

    reelList.innerHTML = reelNotes.map(n => '<li>' + escapeHtml(n.note) + '</li>').join('');
    storyList.innerHTML = storyNotes.map(n => '<li>' + escapeHtml(n.note) + '</li>').join('');

    reelSection.hidden = reelNotes.length === 0;
    storySection.hidden = storyNotes.length === 0;

    const totalEmpty = reelNotes.length === 0 && storyNotes.length === 0;
    emptyMsg.hidden = !totalEmpty;
    box.hidden = false;
  }

  function renderAll(){
    renderCalendar();
    renderMonthlyPromo();
    renderNotesForLena();
  }

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderAll();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderAll();
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    renderAll();
    openTodayModal();
  });

  async function init(){
    const grid = document.getElementById('grid');
    setStaleNoticeVisible(false);

    const cached = loadCachedData();
    const hasCache = !!(cached && cached.rows.length);

    if(hasCache){
      CONTENT = mapRowsToContent(cached.rows);
      MONTHLY_PLAN = mapMonthlyPlanRows(cached.monthlyPlan);
      NOTES_FOR_LENA = mapNotesForLenaRows(cached.notesForLena);
      renderAll();
    } else {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:40px 0;">טוענת נתונים מהגיליון…</p>';
    }

    try{
      const fresh = await fetchSheetData();
      CONTENT = mapRowsToContent(fresh.rows);
      MONTHLY_PLAN = mapMonthlyPlanRows(fresh.monthlyPlan);
      NOTES_FOR_LENA = mapNotesForLenaRows(fresh.notesForLena);
      saveCachedData(fresh.rows, fresh.monthlyPlan, fresh.notesForLena);
      renderAll();
      setStaleNoticeVisible(false);
    }catch(err){
      console.error(err);
      if(hasCache){
        // יש כבר מה להציג על המסך — משאירים אותו, רק מודיעים בעדינות שהוא לא עודכן.
        setStaleNoticeVisible(true);
      } else {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:40px 0;">לא הצלחנו לטעון כרגע נתונים מהגיליון. רעננו את הדף ונסו שוב.</p>';
      }
    }
  }

  init();
</script>
</body>
</html>
